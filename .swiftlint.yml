included:
  - "Demo App Vision"
  - Packages

excluded:
  - DerivedData
  - .build
  - .swiftpm

disabled_rules:
  - trailing_whitespace
  - line_length
  - vertical_whitespace
  - trailing_newline
  - opening_brace
  - control_statement
  - empty_enum_arguments
  - function_name_whitespace
  - multiple_closures_with_trailing_closure
  - empty_count
  - shorthand_operator
  - unused_optional_binding
  - implicit_optional_initialization
  - force_unwrapping
  - force_cast
  - implicitly_unwrapped_optional
  - cyclomatic_complexity
  - function_body_length
  - file_length
  - type_body_length


analyzer_rules:
  - unused_declaration
  - unused_import

identifier_name:
  min_length: 2
  excluded:
    - id
    - ar
    - xr
    - x
    - y
    - z
    # Conventional single letters in geometry and color math: plane/line
    # coefficients (a, b, c), points and vectors (p, v, w), interpolation
    # parameter (t), color channels (r, g), and a matrix (m).
    - a
    - b
    - c
    - g
    - m
    - p
    - r
    - t
    - v
    - w

# The placement engines pass whole surface/model/bounds contexts and return
# small labelled tuples from geometry helpers. Splitting those into parameter
# structs is a refactor that can only be verified on device, so the limits sit
# just above the current code rather than at SwiftLint's defaults.
function_parameter_count:
  warning: 10
  error: 11

large_tuple:
  warning: 7
  error: 8

type_name:
  min_length: 3
  max_length: 50

reporter: "xcode"
