name: CI

on:
  push:
    branches: [ main, master, TestingUI, 'release/**' ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint Code
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Determine changed Swift files
        id: changed-swift-files
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base_sha="${{ github.event.pull_request.base.sha }}"
          else
            base_sha="${{ github.event.before }}"
          fi

          if [[ -z "$base_sha" || "$base_sha" == "0000000000000000000000000000000000000000" ]]; then
            base_sha="$(git rev-list --max-parents=0 HEAD)"
          fi

          # macOS runners ship bash 3.2, which has no `mapfile`; a plain read
          # loop works everywhere (the old step exited 127 on every run).
          count=0
          while IFS= read -r file; do
            echo "SCRIPT_INPUT_FILE_${count}=${file}" >> "$GITHUB_ENV"
            count=$((count + 1))
          done < <(git diff --name-only --diff-filter=ACMR "$base_sha" "${{ github.sha }}" -- '*.swift')

          echo "count=${count}" >> "$GITHUB_OUTPUT"
          echo "SCRIPT_INPUT_FILE_COUNT=${count}" >> "$GITHUB_ENV"

      - name: Run SwiftLint On Changed Files
        if: steps.changed-swift-files.outputs.count != '0'
        run: swiftlint lint --strict --use-script-input-files

      - name: Skip SwiftLint When No Swift Files Changed
        if: steps.changed-swift-files.outputs.count == '0'
        run: echo "No Swift files changed. Skipping SwiftLint."

  build-visionos:
    name: Test and archive visionOS
    # The app targets visionOS 26, whose SDK ships with Xcode 26; older runner
    # images cannot build it at all.
    runs-on: macos-26
    needs: lint
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Cache Xcode DerivedData
        uses: actions/cache@v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: ${{ runner.os }}-visionos-deriveddata-${{ hashFiles('**/*.xcodeproj/**') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-visionos-deriveddata-${{ hashFiles('**/*.xcodeproj/**') }}-
            ${{ runner.os }}-visionos-deriveddata-

      - name: Install visionOS simulator runtime
        run: xcodebuild -downloadPlatform visionOS

      - name: Run catalog, package, and app regression tests
        run: Tools/run-tests.sh

      - name: Archive Release for Apple Vision Pro
        run: >-
          xcodebuild archive -project "Demo App.xcodeproj"
          -scheme "Demo App Vision" -configuration Release
          -destination "generic/platform=visionOS"
          -archivePath "$RUNNER_TEMP/DesignSphere.xcarchive"
          CODE_SIGNING_ALLOWED=NO
