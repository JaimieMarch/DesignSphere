name: Catalog availability

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Download and validate manifest
        shell: bash
        run: |
          set -euo pipefail
          base_url="https://pub-efd589f26cb24d3db0c409b9416b4ecd.r2.dev"
          curl --fail --silent --show-error --location --retry 3 \
            --max-time 30 "${base_url}/catalog.json" --output catalog.json
          jq --exit-status \
            '.version == 1 and (.models | length >= 182) and all(.models[]; (.file.url | length > 0) and (.file.bytes > 0))' \
            catalog.json

      - name: Verify a hosted model is downloadable
        shell: bash
        run: |
          set -euo pipefail
          base_url="https://pub-efd589f26cb24d3db0c409b9416b4ecd.r2.dev"
          model_path="$(jq --raw-output '.models | min_by(.file.bytes) | .file.url' catalog.json)"
          curl --fail --silent --show-error --location --retry 3 \
            --max-time 60 "${base_url}/${model_path}" --output /dev/null
